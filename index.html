<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاذ شعيب • هدية جنى الأسطورية v3.0</title>
<style>
:root {
  --bg-color: #06020e;
  --primary-pink: #ff2a9d;
  --accent-purple: #8a2be2;
  --neon-cyan: #00f0ff;
  --glass-bg: rgba(20, 8, 38, 0.88);
  --glass-border: rgba(255, 42, 157, 0.4);
  --text-main: #fff0f8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* خلفية متدرجة متحركة */
.bg-glow {
  position: fixed; inset: 0; z-index: -3;
  background: radial-gradient(circle at 20% 20%, rgba(255, 42, 157, 0.15), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.2), transparent 45%);
}

.wrap { width: min(1000px, 92%); margin: auto; padding: 20px 0; }
.hidden { display: none !important; }

/* أزرار ومدخلات */
button {
  background: linear-gradient(135deg, var(--primary-pink), var(--accent-purple));
  color: #fff; border: none; border-radius: 50px; padding: 14px 28px;
  font-size: 16px; font-weight: bold; cursor: pointer;
  box-shadow: 0 0 20px rgba(255, 42, 157, 0.4);
  transition: all 0.3s ease;
}
button:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 42, 157, 0.7); }

input, textarea {
  width: 100%; padding: 14px; border-radius: 12px;
  border: 1px solid var(--glass-border); background: rgba(10, 3, 22, 0.9);
  color: #fff; margin: 8px 0 16px; font-size: 15px;
}

/* شاشة القفل */
.lock-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.lock-card {
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 28px; padding: 40px 25px; text-align: center;
  width: min(420px, 100%); backdrop-filter: blur(20px);
  box-shadow: 0 0 50px rgba(255, 42, 157, 0.25);
}

/* شاشة التتابع بالثواني */
#loveSequence {
  position: fixed; inset: 0; z-index: 999;
  background: radial-gradient(circle, #18052e 0%, #05010a 90%);
  display: none; align-items: center; justify-content: center; text-align: center;
}
#loveSequence.active { display: flex; }
.seq-text {
  font-size: clamp(28px, 6vw, 52px); font-weight: 900;
  color: #fff; text-shadow: 0 0 20px var(--primary-pink), 0 0 40px var(--neon-cyan);
  animation: pulseZoom 0.8s ease-in-out infinite alternate;
}
@keyframes pulseZoom { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

/* هيرو وفيديو الخلفية */
.hero {
  min-height: 90vh; display: flex; align-items: center; justify-content: center;
  text-align: center; position: relative; overflow: hidden;
}
.hero-video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0.55; z-index: -1; filter: brightness(0.85);
}

.glass-box {
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 24px; padding: 25px; margin: 20px 0;
  backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }

/* العداد */
.counter-box { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
.counter-item { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); padding: 15px; border-radius: 16px; min-width: 80px; text-align: center; }
.counter-num { font-size: 26px; font-weight: bold; color: var(--primary-pink); }

/* الصور الدائرية */
.circle-imgs { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
.circle-card { width: 130px; height: 130px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary-pink); box-shadow: 0 0 25px var(--primary-pink); }
.circle-card img { width: 100%; height: 100%; object-fit: cover; }

/* الموسيقى */
#musicBar {
  position: fixed; bottom: 15px; left: 15px; z-index: 100;
  background: rgba(15, 5, 30, 0.95); border: 1px solid var(--primary-pink);
  border-radius: 30px; padding: 10px 20px; display: flex; align-items: center; gap: 12px;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- شاشة القفل -->
<div id="lockPage" class="lock-screen">
  <div class="lock-card">
    <div style="font-size: 50px; margin-bottom: 10px;">🎁</div>
    <h2>هدية خاصة لجنى ❤️</h2>
    <p style="opacity: 0.8; margin: 10px 0 20px;">اكتبي كلمة السر لفتح الهدية</p>
    <input type="password" id="passInput" placeholder="كلمة السر..." style="text-align: center;">
    <button onclick="checkPass()">افتحي الهدية ✨</button>
    <p id="errMsg" style="color: #ff4f8b; margin-top: 10px; font-weight: bold;"></p>
  </div>
</div>

<!-- شاشة التتابع الرومانسية بالثواني -->
<div id="loveSequence">
  <div id="seqText" class="seq-text">❤️ عيد حب سعيد يا چوچا ❤️</div>
</div>

<!-- الموقع الرئيسي -->
<div id="mainSite" class="hidden">
  
  <!-- الهيرو مع الفيديو -->
  <section class="hero">
    <video id="heroVid" class="hero-video" autoplay loop muted playsinline></video>
    <div class="wrap">
      <h1 id="siteTitle" style="font-size: clamp(30px, 6vw, 48px); margin-bottom: 15px;">إلى جنى… حكاية صغيرة من قلبي ❤️</h1>
      <p id="siteSub" style="font-size: 18px; opacity: 0.9;">مساحة خاصة مصممة بكل حب لتخليد ذكرياتنا.</p>
    </div>
  </section>

  <main class="wrap">
    
    <!-- قسم العداد -->
    <div class="glass-box">
      <h2 style="text-align: center; color: var(--primary-pink);">⏳ عداد حكايتنا</h2>
      <div class="counter-box">
        <div class="counter-item"><div class="counter-num" id="cD">0</div><div>يوم</div></div>
        <div class="counter-item"><div class="counter-num" id="cH">00</div><div>ساعة</div></div>
        <div class="counter-item"><div class="counter-num" id="cM">00</div><div>دقيقة</div></div>
        <div class="counter-item"><div class="counter-num" id="cS">00</div><div>ثانية</div></div>
      </div>
    </div>

    <!-- قسم الصور الدائرية -->
    <div class="glass-box" style="text-align: center;">
      <h2 style="color: var(--primary-pink);">💖 صور لا تُنسى</h2>
      <div class="circle-imgs">
        <div class="circle-card"><img id="img1" alt="صورة 1"></div>
        <div class="circle-card"><img id="img2" alt="صورة 2"></div>
      </div>
    </div>

    <!-- قسم الرسائل الـ 10 -->
    <div class="glass-box">
      <h2 style="text-align: center; color: var(--primary-pink); margin-bottom: 20px;">💌 رسائل خاصة ليكي</h2>
      <div id="msgGrid" class="grid"></div>
    </div>

    <!-- التوقيع -->
    <div class="glass-box" style="text-align: center; margin-top: 30px;">
      <h2 style="font-size: 32px; color: var(--primary-pink);">معاذ شعيب</h2>
      <p style="margin-top: 8px;">صُنعت بكل عشق وحب ❤️</p>
    </div>

  </main>
</div>

<!-- مشغل الموسيقى -->
<div id="musicBar" class="hidden">
  <span style="font-size: 20px;">🎵</span>
  <span id="musicStatus" style="font-size: 13px;">موسيقى رومانسية...</span>
  <button onclick="toggleAudio()" style="padding: 6px 14px; font-size: 12px;">تشغيل/إيقاف</button>
  <audio id="bgAudio" loop></audio>
</div>

<script>
// تحويل روابط درايف لرابط صريح ومباشر
function driveFix(url) {
  if(!url) return "";
  var m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? "https://lh3.googleusercontent.com/d/" + m[1] : url;
}

// البيانات الأساسية المربوطة فوراً
var appData = {
  pass: "1234",
  title: "إلى جنى… حكاية صغيرة من قلبي ❤️",
  video: driveFix("https://drive.google.com/file/d/1KaiD81iinuuYaDW7C3nXSZPjkU8EkwQh/view?usp=drivesdk"),
  img1: driveFix("https://drive.google.com/file/d/1CirraVRSfknAShQBzuCcvKR815iZ8Ryl/view?usp=drivesdk"),
  img2: driveFix("https://drive.google.com/file/d/1RVHVXkKzbiv4bS19YnKslkhz2hVaOOD3/view?usp=drivesdk"),
  startDate: "2025-06-09T18:30",
  music: "https://assets.mixkit.co/music/preview/mixkit-romantic-suspense-499.mp3",
  messages: [
    "بصي بقى، البوست البنات الكلام ده ليكي: أنا بحبك وطول مانا فيا الروح هفضل أحبك ومش هحب حد غيرك يا ست البنات، لأنك أحلى حاجة شافت عيني.",
    "بحبك يا صدفة لقيت فيها عمري وأجمل من اختاره قلبي.",
    "حتى لو كان لدي مليون اختيار هفضل أختارك في كل مرة.",
    "أنا قوي بيكي يا نقطة ضعفي.",
    "وجودك في حياتي لوحده كفاية يخليني أحب أيامي أكتر. بحبك يا جنى.",
    "يا جنى لو كان ليا أختار من بين كل احتمالات الدنيا هختارك ألف مرة، لأن قلبي لما عرفك مبقاش عاوز يعرف طريق لحد غيرك.",
    "حتى يومي العادي لما بسمع صوتك فيه بيتحول لأحلى يوم. فاكرة؟ ❤️",
    "مهما قلت كلام وإني بحبك قد إيه مش هيوصف اللي جوايا ليكي، بس فعلًا إنتِ أغلى حد في حياتي. بحبك بحبك.",
    "بحبك بحبك. شكرًا على كل لحظة حلوة وكل كلمة لطيفة.",
    "دي مش نهاية الحكاية، دي صفحة صغيرة من ذكريات جميلة. بحبك يا ممرضة قلبي ❤️"
  ]
};

// التحقق وتطبيق التتابع
function checkPass() {
  var p = document.getElementById("passInput").value.trim();
  if(p === appData.pass) {
    document.getElementById("lockPage").classList.add("hidden");
    var seq = document.getElementById("loveSequence");
    var txt = document.getElementById("seqText");
    seq.classList.add("active");

    // 1) أول 4 ثوانٍ
    txt.textContent = "❤️ عيد حب سعيد يا چوچا ❤️";

    // 2) بعد 4 ثوانٍ
    setTimeout(function(){
      txt.textContent = "💖 بحبك يا جنى 💖";
    }, 4000);

    // 3) بعد 7 ثوانٍ
    setTimeout(function(){
      txt.textContent = "✨ من معاذ شعيب ✨";
    }, 7000);

    // 4) فتح الموقع النهائي بعد 9.5 ثوانٍ
    setTimeout(function(){
      seq.classList.remove("active");
      document.getElementById("mainSite").classList.remove("hidden");
      document.getElementById("musicBar").classList.remove("hidden");
      initSite();
    }, 9500);

  } else {
    document.getElementById("errMsg").textContent = "كلمة السر غلط يا جوجا، حاولي تاني 💔";
  }
}

// تهيئة عناصر الموقع
function initSite() {
  document.getElementById("heroVid").src = appData.video;
  document.getElementById("img1").src = appData.img1;
  document.getElementById("img2").src = appData.img2;
  
  // بناء كروت الرسائل
  var mContainer = document.getElementById("msgGrid");
  mContainer.innerHTML = appData.messages.map(function(m, i){
    return '<div class="glass-box" style="margin:0; padding:15px;">' +
      '<h4 style="color:var(--primary-pink);">رسالة ' + (i+1) + ' 💌</h4>' +
      '<p style="margin-top:10px; line-height:1.6;">' + m + '</p>' +
    '</div>';
  }).join("");

  // تشغيل الصوت
  var audio = document.getElementById("bgAudio");
  audio.src = appData.music;
  audio.play().catch(function(){});

  // العداد
  setInterval(updateTimer, 1000);
}

function updateTimer() {
  var start = new Date(appData.startDate);
  var diff = Math.max(0, new Date() - start);
  document.getElementById("cD").textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
  document.getElementById("cH").textContent = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
  document.getElementById("cM").textContent = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
  document.getElementById("cS").textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
}

function toggleAudio() {
  var a = document.getElementById("bgAudio");
  if(a.paused) a.play(); else a.pause();
}
</script>

</body>
</html>
